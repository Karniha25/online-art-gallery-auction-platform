<!DOCTYPE html>

<html>
<head>
    <title>Online Art Gallery - Browse Artworks</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

```
<h1>Online Art Gallery</h1>

<h2>Available Artworks</h2>

<div id="artworkList"></div>
```

</div>

<script>

const API_URL = "http://localhost:8080/api/artworks";

function loadArtworks() {

    fetch(API_URL)

        .then(response => response.json())

        .then(artworks => {

            const list = document.getElementById("artworkList");

            list.innerHTML = "";

            if (artworks.length === 0) {
                list.innerHTML = "<p>No artworks available.</p>";
                return;
            }

            artworks.forEach(artwork => {

                const div = document.createElement("div");

                div.innerHTML = `
                    <div>
                        ${
                            artwork.image
                            ? `<img src="${artwork.image}"
                                    width="200"
                                    alt="${artwork.title}">`
                            : ""
                        }

                        <h3>${artwork.title}</h3>

                        <p>Price: ₹${artwork.price}</p>

                        <button onclick="viewArtwork(${artwork.id})">
                            View Details
                        </button>

                        <hr>
                    </div>
                `;

                list.appendChild(div);

            });

        })

        .catch(error => {

            console.error(error);

            document.getElementById("artworkList").innerHTML =
                "<p>Unable to load artworks.</p>";

        });
}


function viewArtwork(id) {

    fetch(`${API_URL}/${id}`)

        .then(response => response.json())

        .then(artwork => {

            alert(
                "Title: " + artwork.title +
                "\nPrice: ₹" + artwork.price
            );

        })

        .catch(error => {

            console.error(error);

        });
}


loadArtworks();

</script>

</body>
</html>
