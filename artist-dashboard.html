<!DOCTYPE html>
<html>
<head>
    <title>Artist Dashboard - ArtVista</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">ArtVista</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="artwork.html">Manage Artworks</a>
        <a href="artists.html">Artists</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
</header>

<div class="container">

    <h1>Artist Dashboard</h1>

    <p id="welcomeMessage"></p>

    <hr>

    <h2>Artist Options</h2>

    <button onclick="window.location.href='artwork.html'">
        Manage My Artworks
    </button>

    <button onclick="window.location.href='index.html'">
        View Main Gallery
    </button>

</div>

<script>

const loggedInUser =
    JSON.parse(localStorage.getItem("loggedInUser"));

if (!loggedInUser || loggedInUser.role !== "ARTIST") {

    window.location.href = "login.html";

} else {

    document.getElementById("welcomeMessage").innerText =
        "Welcome, " + loggedInUser.name + "!";
}

function logout() {

    localStorage.removeItem("loggedInUser");

    window.location.href = "login.html";
}

</script>

</body>
</html>
